name: QTTabBar

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    env:
      Solution_Name: 'QTTabBar Rebirth.sln'

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2
      with:
        nuget-version: 'latest'

    - name: NuGet Restore
      run: nuget restore $env:Solution_Name

    - name: Restore test project
      run: dotnet restore "QTTabBar.Tests\QTTabBar.Tests.csproj"

    - name: Build
      run: msbuild "QTTabBar.Tests\QTTabBar.Tests.csproj" /t:Build /p:Configuration=$env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Run Tests
      run: dotnet test "QTTabBar.Tests\QTTabBar.Tests.csproj" --no-build --configuration $env:Configuration --logger "trx;LogFileName=test-results.trx" --results-directory TestResults
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: TestResults\*.trx

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: QTTabBar
        path: QTTabBar\bin\${{ matrix.configuration }}\**\*

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: QTTabBar\bin\${{ matrix.configuration }}\**\*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
