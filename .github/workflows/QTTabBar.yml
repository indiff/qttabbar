name: QTTabBar

on:
  push:
    branches: [ dev,master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    env:
      Solution_Name: 'QTTabBar Rebirth.sln'

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Setup NuGet
      uses: nuget/setup-nuget@v4
      with:
        nuget-version: 'latest'

    - name: NuGet Restore
      run: nuget restore $env:Solution_Name

    - name: Restore test project
      run: dotnet restore "QTTabBar.Tests\QTTabBar.Tests.csproj"

    - name: Build
      shell: pwsh
      run: |
        $slnDir = $env:GITHUB_WORKSPACE + "\"
        msbuild "QTTabBar.Tests\QTTabBar.Tests.csproj" /t:Build "/p:Configuration=$env:Configuration" "/p:SolutionDir=$slnDir"
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Run Tests
      run: dotnet test "QTTabBar.Tests\QTTabBar.Tests.csproj" --no-build --configuration $env:Configuration --logger "trx;LogFileName=test-results.trx" --results-directory TestResults
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results
        path: TestResults\*.trx

    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: QTTabBar
        path: QTTabBar\bin\${{ matrix.configuration }}\**\*

  release-installer:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/dev'
    runs-on: windows-latest
    permissions:
      contents: write   # required for softprops/action-gh-release to create the release

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Setup NuGet
      uses: nuget/setup-nuget@v4
      with:
        nuget-version: 'latest'

    - name: NuGet Restore
      run: nuget restore "QTTabBar Rebirth.sln"

    - name: Install WiX Toolset v3
      run: choco install wixtoolset -y

    - name: Build installer
      shell: pwsh
      run: |
        if ("${{ github.ref }}" -eq "refs/heads/dev") {
          $version = "1.6.1"
        } else {
          $version = "${{ github.ref_name }}" -replace '^v', ''
        }
        Write-Host "Using version: $version"
        .\Installer\Build-Installer.ps1 -Version $version
        echo "VERSION=$version" >> $env:GITHUB_ENV

    - name: Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v3
      with:
        files: Installer\bin\Release\QTTabBar Setup ${{ env.VERSION }}.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload dev installer artifact
      if: github.ref == 'refs/heads/dev'
      uses: actions/upload-artifact@v7
      with:
        name: QTTabBar-Dev-Installer
        path: Installer\bin\Release\QTTabBar Setup ${{ env.VERSION }}.exe